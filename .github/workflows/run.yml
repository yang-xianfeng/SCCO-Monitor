name: SCCO Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  # ═══════════════════════════════════════════════════════════════
  #  GitHub Actions cron 运行在 UTC，不支持时区
  #  美股交易: Mon-Fri 9:30-16:00 ET
  #  夏令时 EDT = UTC-4  /  冬令时 EST = UTC-5
  #
  #  cron 在有效 UTC 窗口 (13-21) 每 5 分钟触发，Python check_schedule()
  #  匹配 [槽位, 槽位+BUFFER] 窗口 — cron 启动延迟由 BUFFER 吸收，
  #  槽位自身不修改，且每周期在工作流内持续重试以最大化部署命中率。
  #  - EDT: ET 9:00-16:55 = UTC 13:00-20:55
  #  - EST: ET 9:00-16:55 = UTC 14:00-21:55
  #  未命中槽位窗口的 run -> 时间预算内重试后退出 (不报失败邮件)
  #  ═══════════════════════════════════════════════════════════════
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# cancel-in-progress: 新 cron 到来时取消旧排队 run，避免堆叠阻塞最新调度
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run monitor
        id: run
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # push / workflow_dispatch: 立即部署仓库现有 docs（数据已提交）
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::手动/推送触发：直接部署现有页面"
            exit 0
          fi
          # cron: 严格按 ET 调度表生成后部署。
          # cron 可能比计划时刻提前/延后启动，故在时间预算内持续重试，
          # 直到墙钟进入某槽位的 [槽位, 槽位+BUFFER] 窗口 → main.py 生成 → 部署。
          # 非槽位不算失败(继续尝试)，异常同样继续尝试，最大化部署命中率。
          BUDGET=$(($(date +%s) + 300))   # 5 分钟时间预算
          INTERVAL=15
          while [ "$(date +%s)" -lt "$BUDGET" ]; do
            rm -f data/.generated
            if .venv/bin/python main.py; then
              if [ -f data/.generated ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "::notice::成功生成数据，执行部署"
                exit 0
              fi
              echo "::notice::尚未进入槽位窗口，继续重试..."
            else
              echo "::warning::main.py 运行异常，继续重试..."
            fi
            sleep $INTERVAL
          done
          echo "::notice::时间预算内未命中槽位窗口，本周期跳过部署（cron 将在 5 分钟后重试）"
          exit 0
        env:
          THRESHOLD_SAFE: ${{ vars.THRESHOLD_SAFE }}
          THRESHOLD_WATCH: ${{ vars.THRESHOLD_WATCH }}
          THRESHOLD_HOT: ${{ vars.THRESHOLD_HOT }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data & HTML
        if: steps.run.outputs.deploy == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "auto: update data & chart [skip ci]"
          file_pattern: data/ docs/

      - name: Setup Pages
        if: steps.run.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy Pages
        id: deployment
        if: steps.run.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

      - name: Cleanup old runs (keep last 50)
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
