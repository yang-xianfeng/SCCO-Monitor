name: SCCO Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  # ═══════════════════════════════════════════════════════════════
  #  GitHub Actions cron 运行在 UTC，不支持时区
  #  美股交易: Mon-Fri 9:30-16:00 ET
  #  夏令时 EDT = UTC-4  /  冬令时 EST = UTC-5
  #
  #  cron 在有效 UTC 窗口 (13-21) 每 5 分钟触发，Python check_schedule()
  #  匹配 [槽位, 槽位+BUFFER] 窗口 — cron 启动延迟由 BUFFER 吸收，
  #  槽位自身不修改，且每周期在工作流内持续重试以最大化部署命中率。
  #  - EDT: ET 9:00-16:55 = UTC 13:00-20:55
  #  - EST: ET 9:00-16:55 = UTC 14:00-21:55
  #  未命中槽位窗口的 run -> 时间预算内重试后退出 (不报失败邮件)
  #  ═══════════════════════════════════════════════════════════════
  schedule:
    - cron: '*/5 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# 排队部署，避免在部署过程中被新 run 意外中断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run monitor
        id: run
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # push / workflow_dispatch: 强制执行监控并部署
            export FORCE_RUN=1
          fi

          # 严格按照时间槽多次触发重试，起码重复 6-8 次直至成功
          MAX_RETRIES=8
          INTERVAL=10
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            rm -f data/.generated
            echo "::notice::[执行监控] 第 ${i}/${MAX_RETRIES} 次运行 main.py..."
            if python main.py; then
              if [ -f data/.generated ]; then
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                echo "::notice::第 ${i} 次运行成功生成数据，执行部署"
                SUCCESS=true
                break
              else
                echo "::notice::当前非调度时段或该槽位今日已成功部署，跳过本次部署"
                SUCCESS=true
                break
              fi
            else
              echo "::warning::第 ${i}/${MAX_RETRIES} 次运行异常，${INTERVAL}s 后重试..."
              sleep $INTERVAL
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::所有 ${MAX_RETRIES} 次重试均异常失败"
            exit 1
          fi
        env:
          THRESHOLD_SAFE: ${{ vars.THRESHOLD_SAFE }}
          THRESHOLD_WATCH: ${{ vars.THRESHOLD_WATCH }}
          THRESHOLD_HOT: ${{ vars.THRESHOLD_HOT }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit data & HTML
        if: steps.run.outputs.deploy == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "auto: update data & chart [skip ci]"
          file_pattern: data/ docs/

      - name: Setup Pages
        if: steps.run.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy Pages
        id: deployment
        if: steps.run.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

