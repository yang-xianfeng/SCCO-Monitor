name: Cleanup Old Runs

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日午夜 UTC 运行一次
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old runs (keep last 50)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
